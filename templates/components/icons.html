{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

{% elif name == 'building' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h1M15 7h1M8 12h1M15 12h1"/>
{% elif name == 'chart' %}<path d="M4 20V10M12 20V4M20 20v-7"/>
{% elif name == 'history' %}<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>
{% elif name == 'bell' %}<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>

{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'logout' %}<path d="M9 3H4v18h5M10 12h11m-4-4 4 4-4 4"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'eye' %}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'eye-off' %}<path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A12 12 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3 3.7M6.1 6.1A19 19 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.9-1.6"/>

{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'alert' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>
{% elif name == 'flame' %}<path d="M12 3c1 4-3 5-3 9 0 2 1 3 3 3 3 0 4-3 3-5 4 3 5 6 3 9-1 2-3 3-6 3-5 0-8-3-8-7 0-5 5-6 8-12Z"/>
{% elif name == 'flag' %}<path d="M5 21V3m0 1c5-3 9 3 14 0v10c-5 3-9-3-14 0"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>
{% elif name == 'empty' %}<path d="M4 7h16v14H4zM8 3h8M8 11h8M9 15h6"/>
{% else %}<circle cx="12" cy="12" r="9"/>
{% endif %}
</svg>
